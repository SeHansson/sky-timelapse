<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff9f"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#0a0e14" rx="6"/>
  
  <!-- Sky -->
  <circle cx="16" cy="12" r="9" fill="#0077b6"/>
  
  <!-- Sun -->
  <circle cx="16" cy="9" r="3" fill="#ffd60a"/>
  
  <!-- Camera -->
  <rect x="10" y="20" width="12" height="8" rx="2" fill="#1c2128" stroke="url(#grad)" stroke-width="1"/>
  <circle cx="16" cy="24" r="2.5" fill="#00ff9f" opacity="0.8"/>
  
  <!-- Recording dot -->
  <circle cx="20" cy="21" r="1" fill="#ff006e"/>
</svg>
